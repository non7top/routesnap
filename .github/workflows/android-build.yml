name: CI/CD Pipeline

on:
  push:
    branches: ["main", "master", "develop"]
    tags: ['v*']
  pull_request:
    branches: ["main", "master", "develop"]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  # ============================================================================
  # Code Quality Jobs (parallel, no APK needed)
  # ============================================================================

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.2.0
      with:
        cache-read-only: false

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run lint
      run: ./gradlew lint --no-daemon --build-cache

    - name: Upload lint reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: lint-reports-${{ github.run_id }}
        path: app/build/reports/lint/
        if-no-files-found: ignore

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.2.0
      with:
        cache-read-only: false

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check dependencies
      run: ./gradlew dependencies --no-daemon --build-cache

  # ============================================================================
  # Unit Tests (no APK needed - JVM tests only)
  # ============================================================================

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.2.0
      with:
        cache-read-only: false

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests
      run: ./gradlew test --no-daemon --build-cache

    - name: Upload test reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: unit-test-reports-${{ github.run_id }}
        path: app/build/reports/tests/
        if-no-files-found: ignore

  # ============================================================================
  # APK Build (single build, reused by all validation jobs)
  # ============================================================================

  build-debug:
    name: Build Debug APK
    uses: ./.github/workflows/reusable-build-apk.yml
    with:
      build-type: debug
      version-name: ${{ github.event_name == 'pull_request' && format('pr{0}-{1}', github.event.pull_request.number, github.sha) || github.sha }}

  build-release:
    name: Build Release APK
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/reusable-build-apk.yml
    with:
      build-type: release
      version-name: ${{ github.event_name == 'pull_request' && format('pr{0}-{1}', github.event.pull_request.number, github.sha) || github.sha }}

  # ============================================================================
  # APK Validation (reuses APK from build-debug via artifacts)
  # ============================================================================

  validate-debug-apk:
    name: Validate Debug APK
    needs: [build-debug]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Download debug APK
      uses: actions/download-artifact@v8
      with:
        pattern: app-debug-*
        merge-multiple: true
        path: ./apk-download

    - name: List downloaded files
      run: |
        echo "=== Downloaded files ==="
        ls -la ./apk-download/
        find ./apk-download/ -name "*.apk" -type f

    - name: Find APK path
      id: find-apk
      run: |
        APK_PATH=$(find ./apk-download/ -name "*.apk" -type f | head -1)
        if [ -n "$APK_PATH" ]; then
          echo "apk-path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"
        else
          echo "No APK found!"
          exit 1
        fi

    - name: Verify APK signature
      run: |
        if unzip -l "${{ steps.find-apk.outputs.apk-path }}" | grep -q "META-INF/"; then
          echo "✓ APK contains META-INF directory"
        else
          echo "✗ APK does not contain META-INF directory"
          exit 1
        fi

    - name: Verify APK structure
      run: |
        echo "=== APK Contents ==="
        unzip -l "${{ steps.find-apk.outputs.apk-path }}" | head -50

        echo ""
        echo "=== Checking required files ==="

        if unzip -l "${{ steps.find-apk.outputs.apk-path }}" | grep -q "AndroidManifest.xml"; then
          echo "✓ AndroidManifest.xml found"
        else
          echo "✗ AndroidManifest.xml missing"
          exit 1
        fi

        if unzip -l "${{ steps.find-apk.outputs.apk-path }}" | grep -q "classes.dex"; then
          echo "✓ classes.dex found"
        else
          echo "✗ classes.dex missing"
          exit 1
        fi

        if unzip -l "${{ steps.find-apk.outputs.apk-path }}" | grep -q "res/"; then
          echo "✓ resources directory found"
        else
          echo "✗ resources directory missing"
          exit 1
        fi

        echo ""
        echo "=== APK Size ==="
        du -h "${{ steps.find-apk.outputs.apk-path }}"

  # ============================================================================
  # Emulator Testing (reuses APK from build-debug via artifacts)
  # ============================================================================

  test-debug-on-emulator:
    name: Test Debug on Emulator
    needs: [build-debug]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Download debug APK
      uses: actions/download-artifact@v8
      with:
        pattern: app-debug-*
        merge-multiple: true
        path: ./apk-download

    - name: Find APK path
      id: find-apk
      run: |
        APK_PATH=$(find ./apk-download/ -name "*.apk" -type f | head -1)
        if [ -n "$APK_PATH" ]; then
          echo "apk-path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"
        else
          echo "No APK found!"
          exit 1
        fi

    - name: Enable KVM for emulator
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Start Android Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        target: default
        arch: x86_64
        profile: pixel_4
        ram-size: 2048M
        script: |
          echo "Installing APK..."
          adb install -r ${{ steps.find-apk.outputs.apk-path }}

          echo "Launching app..."
          adb shell am start -n com.routesnap.app/.MainActivity

          echo "Waiting for app to start..."
          sleep 10

          echo "Checking for crashes..."
          adb logcat -d | grep -E "FATAL|CRASH|AndroidRuntime" | tail -20 || echo "No crashes found"

          echo "Taking screenshot..."
          adb shell screencap -p /data/local/tmp/screenshot.png
          adb pull /data/local/tmp/screenshot.png /tmp/emulator-screenshot.png

    - name: Upload screenshot artifact
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: emulator-screenshot-${{ github.run_id }}
        path: /tmp/emulator-screenshot.png
        if-no-files-found: ignore

  # ============================================================================
  # Release Job (tag-based releases only)
  # ============================================================================

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-debug, build-release]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download release APK
      uses: actions/download-artifact@v8
      with:
        pattern: app-release-*
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          *.apk
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # Post Artifact Links (PR builds only)
  # ============================================================================

  post-artifact-links:
    name: Post Artifact Links
    needs: [build-debug, lint, dependency-check, unit-tests, validate-debug-apk, test-debug-on-emulator]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && always()

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: app-*
        merge-multiple: true

    - name: Check if artifacts exist
      id: check-artifacts
      run: |
        if ls app-*.apk 1>/dev/null 2>&1; then
          echo "has_artifacts=true" >> $GITHUB_OUTPUT
          echo "Found APK artifacts"
        else
          echo "has_artifacts=false" >> $GITHUB_OUTPUT
          echo "No APK artifacts found"
        fi

    - name: Post comment to PR
      if: steps.check-artifacts.outputs.has_artifacts == 'true'
      run: |
        echo "📦 [Build artifacts ready](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" > /tmp/comment.md

        gh api \
          repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
          --field body="@/tmp/comment.md"
        echo "✓ Comment posted to PR #${{ github.event.pull_request.number }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
