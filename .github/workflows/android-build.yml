name: Android CI/CD

on:
  push:
    branches: [ "main", "master", "develop" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master", "develop" ]

env:
  # Version naming: use PR number for PRs, otherwise use short SHA
  VERSION_NAME: ${{ github.event_name == 'pull_request' && format('pr{0}-{1}', github.event.pull_request.number, github.sha) || github.sha }}
  SHORT_SHA: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Clean build directory
      run: ./gradlew clean

    - name: Set version name for PR builds
      if: github.event_name == 'pull_request'
      run: |
        echo "VERSION_NAME=pr${{ github.event.pull_request.number }}-${{ github.sha }}" >> $GITHUB_ENV

    - name: Build with Gradle
      run: ./gradlew assembleDebug assembleRelease -PversionNameOverride="${{ env.VERSION_NAME }}" --no-build-cache

    - name: Run unit tests only (non-blocking)
      run: ./gradlew testDebugUnitTest --continue || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug -PversionNameOverride="${{ env.VERSION_NAME }}"

    - name: Build Release APK
      run: ./gradlew assembleRelease -PversionNameOverride="${{ env.VERSION_NAME }}"

    - name: Upload Debug APK (PR builds)
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-pr${{ github.event.pull_request.number }}-${{ github.sha }}
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: ignore

    - name: Upload Debug APK (push builds)
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-${{ github.sha }}
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: ignore

    - name: Upload Release APK (PR builds)
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: app-release-pr${{ github.event.pull_request.number }}-${{ github.sha }}
        path: app/build/outputs/apk/release/app-release-unsigned.apk
        if-no-files-found: ignore

    - name: Upload Release APK (push builds)
      if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: app-release-${{ github.sha }}
        path: app/build/outputs/apk/release/app-release-unsigned.apk
        if-no-files-found: ignore

    - name: Upload Build Reports
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-reports
        path: |
          app/build/reports/
          app/build/outputs/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Sign APK (if keystore available)
      id: sign_apk
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      continue-on-error: true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          app/build/outputs/apk/release/*.apk
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
