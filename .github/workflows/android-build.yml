name: Android CI/CD

on:
  push:
    branches: [ "main", "master", "develop" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master", "develop" ]

env:
  VERSION_NAME: ${{ github.event_name == 'pull_request' && format('pr{0}-{1}', github.event.pull_request.number, github.sha) || github.sha }}

jobs:
  build-debug:
    name: Build Debug APK
    uses: ./.github/workflows/reusable-build-apk.yml
    with:
      build-type: debug
      version-name: ${{ env.VERSION_NAME }}

  build-release:
    name: Build Release APK
    uses: ./.github/workflows/reusable-build-apk.yml
    with:
      build-type: release
      version-name: ${{ env.VERSION_NAME }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run lint
      run: ./gradlew lint --no-daemon

    - name: Upload lint reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lint-reports-${{ github.run_id }}
        path: app/build/reports/lint/
        if-no-files-found: ignore

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check dependencies
      run: ./gradlew dependencies --no-daemon

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-debug, build-release]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download release APK
      uses: actions/download-artifact@v4
      with:
        pattern: app-release-*
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          *.apk
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  post-artifact-links:
    name: Post Artifact Links
    needs: [build-debug, build-release, lint, dependency-check]
    if: github.event_name == 'pull_request' && always()
    uses: ./.github/workflows/post-artifact-links.yml
    with:
      run-id: ${{ github.run_id }}
      pr-number: ${{ github.event.pull_request.number }}
