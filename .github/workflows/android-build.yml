name: Android CI/CD

on:
  push:
    branches: [ "main", "master", "develop" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master", "develop" ]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  build-debug:
    name: Build Debug APK
    uses: ./.github/workflows/reusable-build-apk.yml
    with:
      build-type: debug
      version-name: ${{ github.event_name == 'pull_request' && format('pr{0}-{1}', github.event.pull_request.number, github.sha) || github.sha }}

  build-release:
    name: Build Release APK
    uses: ./.github/workflows/reusable-build-apk.yml
    with:
      build-type: release
      version-name: ${{ github.event_name == 'pull_request' && format('pr{0}-{1}', github.event.pull_request.number, github.sha) || github.sha }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run lint
      run: ./gradlew lint --no-daemon

    - name: Upload lint reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lint-reports-${{ github.run_id }}
        path: app/build/reports/lint/
        if-no-files-found: ignore

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check dependencies
      run: ./gradlew dependencies --no-daemon

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-debug, build-release]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download release APK
      uses: actions/download-artifact@v4
      with:
        pattern: app-release-*
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          *.apk
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  post-artifact-links:
    name: Post Artifact Links
    needs: [build-debug, build-release, lint, dependency-check]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && always()

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: app-*
        merge-multiple: true

    - name: Check if artifacts exist
      id: check-artifacts
      run: |
        if ls app-*.apk 1>/dev/null 2>&1; then
          echo "has_artifacts=true" >> $GITHUB_OUTPUT
          echo "Found APK artifacts"
        else
          echo "has_artifacts=false" >> $GITHUB_OUTPUT
          echo "No APK artifacts found"
        fi

    - name: Post comment to PR
      if: steps.check-artifacts.outputs.has_artifacts == 'true'
      run: |
        {
          echo "## 📦 Build Artifacts Ready"
          echo ""
          echo "**Workflow**: [${{ github.workflow }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          echo "**Status**: ✅ ${{ job.status }}"
          echo ""
          echo "### Download Links"
          echo ""
          echo "Go to the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) to download artifacts."
          echo ""
          echo "---"
          echo "*This comment was automatically generated by GitHub Actions*"
        } > /tmp/comment.md

        gh api \
          repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
          --field body="@/tmp/comment.md"
        echo "✓ Comment posted to PR #${{ github.event.pull_request.number }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
