name: Build Android APK

on:
  workflow_call:
    inputs:
      build-type:
        description: 'Build type (debug or release)'
        required: false
        type: string
        default: 'debug'
      version-name:
        description: 'Version name override'
        required: false
        type: string
    outputs:
      apk-path:
        description: 'Path to the built APK'
        value: ${{ jobs.build-apk.outputs.apk-path }}

jobs:
  build-apk:
    name: Build ${{ inputs.build-type }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      apk-path: ${{ steps.find-apk.outputs.apk_path }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.2.0
      with:
        cache-read-only: false

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: |
        if [ "${{ inputs.build-type }}" = "release" ]; then
          ./gradlew assembleRelease -PversionNameOverride="${{ inputs.version-name }}" --no-daemon --build-cache
        else
          ./gradlew assembleDebug -PversionNameOverride="${{ inputs.version-name }}" --no-daemon --build-cache
        fi
      timeout-minutes: 10

    - name: Find APK file
      id: find-apk
      run: |
        APK_PATH=$(find app/build/outputs/apk/${{ inputs.build-type }} -name "*.apk" -type f | head -1)
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        if [ -n "$APK_PATH" ]; then
          echo "Found APK: $APK_PATH"
        else
          echo "No APK found!"
          exit 1
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v7
      with:
        name: app-${{ inputs.build-type }}-${{ github.run_id }}
        path: ${{ steps.find-apk.outputs.apk_path }}
        if-no-files-found: error
        compression-level: 0
