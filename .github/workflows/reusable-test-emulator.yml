name: Test on Android Emulator

on:
  workflow_call:
    inputs:
      apk-path:
        description: 'Path to the APK to test'
        required: false
        type: string
        default: ''
      build-type:
        description: 'Build type (debug or release)'
        required: false
        type: string
        default: 'debug'
      api-level:
        description: 'Android API level for emulator'
        required: false
        type: number
        default: 29

jobs:
  test-on-emulator:
    name: Test on Android Emulator (API ${{ inputs.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK if not provided
      if: inputs.apk-path == ''
      run: |
        ./gradlew assemble${{ inputs.build-type == 'release' && 'Release' || 'Debug' }} --no-daemon
      timeout-minutes: 10

    - name: Find APK file
      id: find-apk
      run: |
        if [ -n "${{ inputs.apk-path }}" ]; then
          APK_PATH="${{ inputs.apk-path }}"
        else
          APK_PATH=$(find app/build/outputs/apk/${{ inputs.build-type }} -name "*.apk" -type f | head -1)
        fi
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "Found APK: $APK_PATH"

    - name: Enable KVM for emulator
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run tests on Android Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ inputs.api-level }}
        target: default
        arch: x86_64
        profile: pixel_4
        ram-size: 2048M
        script: |
          echo "=== Installing APK ==="
          adb install -r ${{ steps.find-apk.outputs.apk_path }}
          echo "=== Verifying installation ==="
          adb shell pm list packages | grep routesnap || exit 1
          echo "=== Launching app ==="
          adb shell am start -n com.routesnap.app/.MainActivity
          echo "=== Waiting for app to start ==="
          sleep 15
          echo "=== Checking for crashes ==="
          adb logcat -d | grep -E "FATAL|CRASH" | tail -20 || echo "No crashes"
          echo "=== Taking screenshot ==="
          adb shell screencap -p /data/local/tmp/screenshot.png
          adb pull /data/local/tmp/screenshot.png /tmp/emulator-screenshot.png

    - name: Upload screenshot artifact
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: emulator-screenshot-${{ github.run_id }}
        path: /tmp/emulator-screenshot.png
        if-no-files-found: ignore
