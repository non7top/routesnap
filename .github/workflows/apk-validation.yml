name: APK Validation Tests

on:
  pull_request:
    branches: ["main", "master", "develop"]
  workflow_run:
    workflows: ["Android CI/CD"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: apk-validation-${{ github.event.workflow_run.head_branch || github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Download artifacts from parent workflow OR build locally for PRs
  # ============================================================================

  download-artifacts:
    name: Download Artifacts
    runs-on: ubuntu-latest
    outputs:
      debug-apk-path: ${{ steps.download-debug.outputs.apk-path }}
      release-apk-path: ${{ steps.download-release.outputs.apk-path }}
      has-debug-apk: ${{ steps.check-debug.outputs.has-artifact }}
      has-release-apk: ${{ steps.check-release.outputs.has-artifact }}
      is-workflow-run: ${{ steps.check-trigger.outputs.is-workflow-run }}
    steps:
    - name: Check trigger type
      id: check-trigger
      run: |
        if [ "${{ github.event_name }}" = "workflow_run" ]; then
          echo "is-workflow-run=true" >> $GITHUB_OUTPUT
        else
          echo "is-workflow-run=false" >> $GITHUB_OUTPUT
        fi

    # For workflow_run: download from parent workflow
    - name: Download debug APK (workflow_run)
      if: steps.check-trigger.outputs.is-workflow-run == 'true'
      uses: actions/download-artifact@v7
      with:
        pattern: app-debug-*
        merge-multiple: true
        github-token: ${{ github.token }}
        run-id: ${{ github.event.workflow_run.id }}

    - name: Download release APK (workflow_run)
      if: steps.check-trigger.outputs.is-workflow-run == 'true' && github.event.workflow_run.event != 'pull_request'
      uses: actions/download-artifact@v7
      with:
        pattern: app-release-*
        merge-multiple: true
        github-token: ${{ github.token }}
        run-id: ${{ github.event.workflow_run.id }}

    # For PR: build APK locally
    - name: Set up JDK 17 (PR)
      if: steps.check-trigger.outputs.is-workflow-run == 'false'
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew (PR)
      if: steps.check-trigger.outputs.is-workflow-run == 'false'
      run: chmod +x gradlew

    - name: Build Debug APK (PR)
      if: steps.check-trigger.outputs.is-workflow-run == 'false'
      run: ./gradlew assembleDebug -PversionNameOverride=pr${{ github.event.pull_request.number }}-${{ github.sha }} --no-daemon
      timeout-minutes: 15

    - name: Find debug APK
      id: find-debug
      if: steps.check-trigger.outputs.is-workflow-run == 'false'
      run: |
        APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
        if [ -n "$APK_PATH" ]; then
          echo "apk-path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found debug APK: $APK_PATH"
        fi

    - name: Check if debug APK exists
      id: check-debug
      run: |
        if [ "${{ steps.check-trigger.outputs.is-workflow-run }}" = "true" ]; then
          if ls app-debug-*.apk 1>/dev/null 2>&1; then
            echo "has-artifact=true" >> $GITHUB_OUTPUT
          else
            echo "has-artifact=false" >> $GITHUB_OUTPUT
          fi
        else
          if [ -n "${{ steps.find-debug.outputs.apk-path }}" ]; then
            echo "has-artifact=true" >> $GITHUB_OUTPUT
          else
            echo "has-artifact=false" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Set debug APK path
      id: download-debug
      if: steps.check-debug.outputs.has-artifact == 'true'
      run: |
        if [ "${{ steps.check-trigger.outputs.is-workflow-run }}" = "true" ]; then
          APK_PATH=$(find . -name "app-debug-*.apk" -type f | head -1)
        else
          APK_PATH="${{ steps.find-debug.outputs.apk-path }}"
        fi
        if [ -n "$APK_PATH" ]; then
          echo "apk-path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found debug APK: $APK_PATH"
        fi

    - name: Check if release APK exists (workflow_run)
      if: steps.check-trigger.outputs.is-workflow-run == 'true'
      id: check-release
      run: |
        if ls app-release-*.apk 1>/dev/null 2>&1; then
          echo "has-artifact=true" >> $GITHUB_OUTPUT
        else
          echo "has-artifact=false" >> $GITHUB_OUTPUT
        fi

    - name: Set release APK path (workflow_run)
      if: steps.check-release.outputs.has-artifact == 'true'
      id: download-release
      run: |
        APK_PATH=$(find . -name "app-release-*.apk" -type f | head -1)
        if [ -n "$APK_PATH" ]; then
          echo "apk-path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found release APK: $APK_PATH"
        fi

  # ============================================================================
  # Validate APK structure - reuses APK from Android CI/CD or local build
  # ============================================================================

  validate-debug-apk:
    name: Validate Debug APK
    needs: [download-artifacts]
    if: needs.download-artifacts.outputs.has-debug-apk == 'true'
    uses: ./.github/workflows/reusable-validate-apk.yml
    with:
      build-type: debug
      apk-path: ${{ needs.download-artifacts.outputs.debug-apk-path }}
      skip-build: true

  validate-release-apk:
    name: Validate Release APK
    needs: [download-artifacts]
    if: needs.download-artifacts.outputs.has-release-apk == 'true'
    uses: ./.github/workflows/reusable-validate-apk.yml
    with:
      build-type: release
      apk-path: ${{ needs.download-artifacts.outputs.release-apk-path }}
      skip-build: true

  # ============================================================================
  # Test on emulator - reuses APK from Android CI/CD or local build
  # ============================================================================

  test-debug-on-emulator:
    name: Test Debug on Emulator
    needs: [download-artifacts]
    if: needs.download-artifacts.outputs.has-debug-apk == 'true'
    uses: ./.github/workflows/reusable-test-emulator.yml
    with:
      build-type: debug
      apk-path: ${{ needs.download-artifacts.outputs.debug-apk-path }}
      skip-build: true

  test-release-on-emulator:
    name: Test Release on Emulator
    needs: [download-artifacts]
    if: needs.download-artifacts.outputs.has-release-apk == 'true'
    uses: ./.github/workflows/reusable-test-emulator.yml
    with:
      build-type: release
      apk-path: ${{ needs.download-artifacts.outputs.release-apk-path }}
      skip-build: true

  # ============================================================================
  # Test Summary
  # ============================================================================

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [download-artifacts, validate-debug-apk, validate-release-apk, test-debug-on-emulator, test-release-on-emulator]
    if: always()

    steps:
    - name: Generate summary
      run: |
        echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### APK Validation" >> $GITHUB_STEP_SUMMARY
        if [ "${{ needs.validate-debug-apk.result }}" == "success" ]; then
          echo "✓ Debug APK structure validated" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.validate-debug-apk.result }}" == "failure" ]; then
          echo "✗ Debug APK validation failed" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Debug APK validation skipped or cancelled" >> $GITHUB_STEP_SUMMARY
        fi

        if [ "${{ needs.validate-release-apk.result }}" == "success" ]; then
          echo "✓ Release APK structure validated" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.validate-release-apk.result }}" == "failure" ]; then
          echo "✗ Release APK validation failed" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.validate-release-apk.result }}" == "skipped" ]; then
          echo "⊘ Release APK validation skipped (PR build)" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Release APK validation cancelled" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Emulator Testing" >> $GITHUB_STEP_SUMMARY
        if [ "${{ needs.test-debug-on-emulator.result }}" == "success" ]; then
          echo "✓ Debug app runs on emulator without crashes" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.test-debug-on-emulator.result }}" == "failure" ]; then
          echo "✗ Debug app crashed or failed on emulator" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Debug emulator test skipped or cancelled" >> $GITHUB_STEP_SUMMARY
        fi

        if [ "${{ needs.test-release-on-emulator.result }}" == "success" ]; then
          echo "✓ Release app runs on emulator without crashes" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.test-release-on-emulator.result }}" == "failure" ]; then
          echo "✗ Release app crashed or failed on emulator" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.test-release-on-emulator.result }}" == "skipped" ]; then
          echo "⊘ Release emulator test skipped (PR build)" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Release emulator test cancelled" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Build Efficiency" >> $GITHUB_STEP_SUMMARY
        if [ "${{ needs.download-artifacts.outputs.is-workflow-run }}" = "true" ]; then
          echo "- ♻️ Reused APK from Android CI/CD workflow" >> $GITHUB_STEP_SUMMARY
        else
          echo "- 🔨 Built APK locally for PR validation" >> $GITHUB_STEP_SUMMARY
        fi
        echo "- ⚡ No duplicate builds in validation workflow" >> $GITHUB_STEP_SUMMARY
