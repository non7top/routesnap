name: Validate APK

on:
  workflow_call:
    inputs:
      apk-path:
        description: 'Path to the APK to validate'
        required: false
        type: string
        default: ''
      build-type:
        description: 'Build type (debug or release)'
        required: false
        type: string
        default: 'debug'

jobs:
  validate-apk:
    name: Validate APK Structure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK if not provided
      if: inputs.apk-path == ''
      run: |
        ./gradlew assemble${{ inputs.build-type == 'release' && 'Release' || 'Debug' }} --no-daemon
      timeout-minutes: 10

    - name: Find APK file
      id: find-apk
      run: |
        if [ -n "${{ inputs.apk-path }}" ]; then
          APK_PATH="${{ inputs.apk-path }}"
        else
          APK_PATH=$(find app/build/outputs/apk/${{ inputs.build-type }} -name "*.apk" -type f | head -1)
        fi
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        if [ -n "$APK_PATH" ]; then
          echo "Found APK: $APK_PATH"
        else
          echo "No APK found!"
          exit 1
        fi

    - name: Verify APK exists
      run: |
        if [ -z "${{ steps.find-apk.outputs.apk_path }}" ]; then
          echo "No APK file found!"
          exit 1
        fi
        ls -lh "${{ steps.find-apk.outputs.apk_path }}"

    - name: Verify APK signature
      run: |
        if unzip -l "${{ steps.find-apk.outputs.apk_path }}" | grep -q "META-INF/"; then
          echo "✓ APK contains META-INF directory (may be signed)"
        else
          echo "✗ APK does not contain META-INF directory"
          exit 1
        fi

    - name: Verify APK structure
      run: |
        echo "=== APK Contents ==="
        unzip -l "${{ steps.find-apk.outputs.apk_path }}" | head -50

        echo ""
        echo "=== Checking required files ==="

        if unzip -l "${{ steps.find-apk.outputs.apk_path }}" | grep -q "AndroidManifest.xml"; then
          echo "✓ AndroidManifest.xml found"
        else
          echo "✗ AndroidManifest.xml missing"
          exit 1
        fi

        if unzip -l "${{ steps.find-apk.outputs.apk_path }}" | grep -q "classes.dex"; then
          echo "✓ classes.dex found"
        else
          echo "✗ classes.dex missing"
          exit 1
        fi

        if unzip -l "${{ steps.find-apk.outputs.apk_path }}" | grep -q "res/"; then
          echo "✓ resources directory found"
        else
          echo "✗ resources directory missing"
          exit 1
        fi

        echo ""
        echo "=== APK Size ==="
        du -h "${{ steps.find-apk.outputs.apk_path }}"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: validated-apk-${{ github.run_id }}
        path: ${{ steps.find-apk.outputs.apk_path }}
        if-no-files-found: ignore
