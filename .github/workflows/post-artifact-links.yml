name: Post Artifact Links

on:
  workflow_run:
    workflows: ["Android CI/CD", "APK Validation Tests"]
    types:
      - completed

jobs:
  post-artifact-links:
    name: Post Artifact Links to PR
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'

    steps:
    - name: Get PR number
      id: pr-number
      run: |
        PR_NUMBER=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }} --jq '.pull_requests[0].number // empty')
        echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
        echo "PR Number: ${PR_NUMBER:-Not found}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create artifact comment
      id: comment
      if: steps.pr-number.outputs.pr_number != ''
      run: |
        echo "Fetching artifacts..."
        
        # Start building the comment
        cat > /tmp/comment.md << 'COMMENT_START'
## 📦 Build Artifacts Ready

COMMENT_START
        
        # Add workflow info
        echo "**Workflow**: [${{ github.event.workflow_run.name }}](${{ github.event.workflow_run.html_url }})" >> /tmp/comment.md
        echo "**Status**: ✅ ${{ github.event.workflow_run.conclusion }}" >> /tmp/comment.md
        echo "" >> /tmp/comment.md
        echo "### Download Links" >> /tmp/comment.md
        echo "" >> /tmp/comment.md
        
        # Fetch and format artifacts
        gh api repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts \
          --jq '.artifacts[] | "- **\(.name)** (\(.size_in_bytes | . / 1024 / 1024 | floor) MB) - [Download](\(.archive_download_url))"' \
          >> /tmp/comment.md
        
        # Add footer
        cat >> /tmp/comment.md << 'COMMENT_END'

---
*This comment was automatically generated by GitHub Actions*
COMMENT_END
        
        echo "Comment created:"
        cat /tmp/comment.md

    - name: Post comment to PR
      if: steps.pr-number.outputs.pr_number != ''
      run: |
        COMMENT_BODY=$(cat /tmp/comment.md)
        gh api \
          repos/${{ github.repository }}/issues/${{ steps.pr-number.outputs.pr_number }}/comments \
          --field body="$COMMENT_BODY"
        echo "✓ Comment posted to PR #${{ steps.pr-number.outputs.pr_number }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
